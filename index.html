<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Octopus AI</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Parser Markdown & Highlight.js (Versions Stables CDNJS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }

    /* Rendu Markdown Style Gemini */
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; color: #f8fafc; margin-top: 1rem; margin-bottom: 0.5rem; }
    .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; }
    .markdown-body table { width: 100%; border-collapse: collapse; margin: 0.75rem 0; font-size: 0.85rem; }
    .markdown-body th, .markdown-body td { border: 1px solid #334155; padding: 0.5rem; text-align: left; }
    .markdown-body th { background-color: #1e293b; }
    
    /* Blocs de code */
    .markdown-body pre { background: #0f172a; border: 1px solid #1e293b; border-radius: 0.75rem; padding: 0.75rem; overflow-x: auto; margin: 0.75rem 0; }
    .markdown-body code { font-family: monospace; font-size: 0.85em; }
    .markdown-body :not(pre) > code { background: #1e293b; padding: 0.2rem 0.4rem; border-radius: 0.25rem; color: #818cf8; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex overflow-hidden">

  <!-- Overlay mobile -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-30 hidden md:hidden"></div>

  <!-- Sidebar Coulissante -->
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-slate-900/95 border-r border-slate-800 flex flex-col justify-between z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300">
    <div class="p-3 flex flex-col h-full overflow-hidden">
      
      <!-- En-tête Sidebar -->
      <div class="flex items-center justify-between mb-4 px-2">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white text-base shadow">🐙</div>
          <span class="font-semibold text-base text-slate-100">Octopus AI</span>
        </div>
        <button id="close-sidebar-btn" class="md:hidden text-slate-400 hover:text-white p-1.5">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Bouton Nouvelle Discussion -->
      <button id="new-chat-btn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2.5 px-3 rounded-xl font-medium transition flex items-center gap-2.5 mb-4 border border-slate-700/50">
        <i class="fa-solid fa-plus text-indigo-400"></i> Nouvelle discussion
      </button>

      <div class="text-[10px] font-semibold text-slate-500 uppercase tracking-wider px-2 mb-2">Récents</div>

      <!-- Historique -->
      <div class="flex-1 overflow-y-auto custom-scrollbar space-y-1 pr-1" id="chat-list"></div>

      <!-- Footer Sidebar -->
      <div class="pt-3 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between px-1">
        <span class="text-[11px] text-slate-500">v2.0 Stable</span>
        <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-medium">Online</span>
      </div>
    </div>
  </aside>

  <!-- Zone Principale -->
  <main class="flex-1 flex flex-col h-full w-full bg-slate-950 relative overflow-hidden">
    
    <!-- Header principal -->
    <header class="h-14 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md px-4 flex items-center justify-between z-20 shrink-0">
      <div class="flex items-center gap-3">
        <button id="open-sidebar-btn" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-800 transition">
          <i class="fa-solid fa-bars text-base"></i>
        </button>
        <h1 class="font-medium text-slate-200 text-sm truncate max-w-[150px] sm:max-w-xs" id="current-chat-title">Nouvelle discussion</h1>
      </div>

      <div class="flex items-center gap-2">
        <button id="web-search-toggle" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs px-2.5 py-1.5 rounded-xl font-medium flex items-center gap-1.5 transition">
          <i class="fa-solid fa-globe text-indigo-400"></i>
          <span id="web-status" class="text-red-400 font-bold">OFF</span>
        </button>

        <select id="mode-select" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-xl px-2.5 py-1.5 focus:outline-none font-medium">
          <option value="general">🤖 Général</option>
          <option value="code">💻 Code</option>
          <option value="writing">📝 Rédaction</option>
        </select>
      </div>
    </header>

    <!-- Zone des Messages -->
    <div id="messages-container" class="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-6 space-y-6 max-w-3xl w-full mx-auto"></div>

    <!-- Zone de Saisie -->
    <div class="p-3 sm:p-4 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent shrink-0">
      <div class="max-w-3xl mx-auto relative">
        <form id="chat-form" class="bg-slate-900 border border-slate-800 rounded-2xl p-2 sm:p-3 shadow-xl">
          <textarea id="user-input" rows="1" placeholder="Posez une question à Octopus AI..." class="w-full bg-transparent text-slate-100 placeholder-slate-500 text-sm focus:outline-none resize-none max-h-32 px-2 py-1 custom-scrollbar"></textarea>
          
          <div class="flex items-center justify-between pt-2 border-t border-slate-800/80 mt-2">
            <div class="flex items-center gap-1 text-slate-400">
              <label class="p-1.5 hover:bg-slate-800 hover:text-slate-200 rounded-lg cursor-pointer transition text-xs flex items-center justify-center">
                <i class="fa-solid fa-paperclip"></i>
                <input type="file" id="file-input" class="hidden">
              </label>
              <button type="button" id="mic-btn" class="p-1.5 hover:bg-slate-800 hover:text-slate-200 rounded-lg transition text-xs">
                <i class="fa-solid fa-microphone"></i>
              </button>
            </div>

            <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl px-3 py-1.5 transition text-xs font-medium flex items-center gap-1.5 shadow">
              <span>Envoyer</span>
              <i class="fa-solid fa-paper-plane text-[10px]"></i>
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!-- LOGIQUE JAVASCRIPT ROBUSTE -->
  <script>
    // Configuration Marked simple et sûre
    if (typeof marked !== 'undefined') {
      marked.setOptions({
        highlight: function(code, lang) {
          if (typeof hljs !== 'undefined') {
            if (lang && hljs.getLanguage(lang)) {
              return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
          }
          return code;
        },
        breaks: true
      });
    }

    let chats = JSON.parse(localStorage.getItem('octopus_chats')) || [];
    let currentChatId = null;
    let isWebSearchActive = false;

    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');
    const openSidebarBtn = document.getElementById('open-sidebar-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const chatListEl = document.getElementById('chat-list');
    const messagesContainer = document.getElementById('messages-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const modeSelect = document.getElementById('mode-select');
    const webToggle = document.getElementById('web-search-toggle');
    const webStatus = document.getElementById('web-status');
    const newChatBtn = document.getElementById('new-chat-btn');
    const currentChatTitle = document.getElementById('current-chat-title');
    const micBtn = document.getElementById('mic-btn');

    // Auto-resize textarea
    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    // Reconnaissance vocale (Micro)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = 'fr-FR';

      micBtn.onclick = () => {
        recognition.start();
        micBtn.classList.add('text-indigo-400');
      };

      recognition.onresult = (e) => {
        userInput.value += e.results[0][0].transcript;
        micBtn.classList.remove('text-indigo-400');
        userInput.style.height = (userInput.scrollHeight) + 'px';
      };

      recognition.onerror = recognition.onend = () => micBtn.classList.remove('text-indigo-400');
    } else {
      micBtn.style.display = 'none';
    }

    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      sidebarOverlay.classList.remove('hidden');
    }

    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      sidebarOverlay.classList.add('hidden');
    }

    openSidebarBtn.onclick = () => sidebar.classList.contains('-translate-x-full') ? openSidebar() : closeSidebar();
    closeSidebarBtn.onclick = closeSidebar;
    sidebarOverlay.onclick = closeSidebar;

    webToggle.onclick = () => {
      isWebSearchActive = !isWebSearchActive;
      webStatus.textContent = isWebSearchActive ? 'ON' : 'OFF';
      webStatus.className = isWebSearchActive ? 'text-emerald-400 font-bold' : 'text-red-400';
    };

    function saveChats() { localStorage.setItem('octopus_chats', JSON.stringify(chats)); }

    function createNewChat() {
      const newChat = { id: Date.now().toString(), title: 'Nouvelle discussion', messages: [] };
      chats.unshift(newChat);
      currentChatId = newChat.id;
      saveChats();
      renderSidebar();
      renderMessages();
      if (window.innerWidth < 768) closeSidebar();
    }

    function renderSidebar() {
      chatListEl.innerHTML = '';
      chats.forEach(chat => {
        const btn = document.createElement('div');
        const isActive = chat.id === currentChatId;
        btn.className = `p-2 rounded-xl text-xs font-medium cursor-pointer flex items-center justify-between group transition ${isActive ? 'bg-indigo-600/10 text-indigo-400' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}`;
        btn.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <i class="fa-regular fa-message text-slate-500"></i>
            <span class="truncate">${chat.title}</span>
          </div>
          <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 p-1 transition">
            <i class="fa-solid fa-trash"></i>
          </button>`;
        btn.onclick = (e) => {
          if (!e.target.closest('button')) {
            currentChatId = chat.id;
            renderSidebar();
            renderMessages();
            if (window.innerWidth < 768) closeSidebar();
          }
        };
        chatListEl.appendChild(btn);
      });
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      currentChatId = chats.length > 0 ? chats[0].id : null;
      saveChats();
      if (!currentChatId) createNewChat();
      else { renderSidebar(); renderMessages(); }
    }

    function renderMessages() {
      const current = chats.find(c => c.id === currentChatId);
      if (!current) return;
      if (currentChatTitle) currentChatTitle.textContent = current.title;

      if (current.messages.length === 0) {
        messagesContainer.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center text-slate-500 my-auto py-12">
            <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-2xl mb-4 text-indigo-400">🐙</div>
            <h2 class="text-xl font-semibold text-slate-200 mb-2">Bonjour ! Comment puis-je vous aider ?</h2>
            <p class="text-xs max-w-sm text-slate-400 leading-relaxed">Posez vos questions, générez du code ou créez des visuels en toute simplicité.</p>
          </div>`;
        return;
      }

      messagesContainer.innerHTML = '';
      current.messages.forEach(m => {
        const isUser = m.role === 'user';
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex gap-3 sm:gap-4 ${isUser ? 'justify-end' : 'justify-start'}`;
        
        let parsedText = (typeof marked !== 'undefined') ? marked.parse(m.content) : m.content;

        let contentHtml = isUser 
          ? `<div class="bg-indigo-600 text-white p-3.5 rounded-2xl text-xs sm:text-sm max-w-[85%] whitespace-pre-wrap">${escapeHtml(m.content)}</div>`
          : `<div class="flex-1 bg-transparent text-slate-200 text-xs sm:text-sm markdown-body overflow-hidden">${parsedText}</div>`;

        msgDiv.innerHTML = `
          ${!isUser ? `<div class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-800 text-indigo-400 flex items-center justify-center text-xs shrink-0 font-bold">🐙</div>` : ''}
          ${contentHtml}
        `;
        messagesContainer.appendChild(msgDiv);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(text) { 
      return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ""; 
    }

    chatForm.onsubmit = async (e) => {
      e.preventDefault();
      const content = userInput.value.trim();
      if (!content) return;

      if (!currentChatId) createNewChat();
      const current = chats.find(c => c.id === currentChatId);

      if (current.messages.length === 0) {
        current.title = content.slice(0, 25) + (content.length > 25 ? '...' : '');
      }

      current.messages.push({ role: 'user', content });
      userInput.value = '';
      userInput.style.height = 'auto';
      saveChats();
      renderSidebar();
      renderMessages();

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'flex gap-3 justify-start';
      loadingDiv.innerHTML = `
        <div class="w-8 h-8 rounded-xl bg-slate-900 border border-slate-800 text-indigo-400 flex items-center justify-center text-xs shrink-0 font-bold">🐙</div>
        <div class="text-xs text-slate-400 flex items-center gap-2 pt-2">
          <i class="fa-solid fa-spinner fa-spin text-indigo-400"></i> Réflexion en cours...
        </div>`;
      messagesContainer.appendChild(loadingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: current.messages, mode: modeSelect.value, webSearch: isWebSearchActive })
        });

        const data = await res.json();
        loadingDiv.remove();

        if (res.ok && data.reply) {
          current.messages.push({ role: 'bot', content: data.reply });
        } else {
          current.messages.push({ role: 'bot', content: `⚠️ Erreur : ${data.error || 'Impossible de répondre'}` });
        }
      } catch (err) {
        loadingDiv.remove();
        current.messages.push({ role: 'bot', content: '⚠️ Connexion interrompue.' });
      }

      saveChats();
      renderMessages();
    };

    newChatBtn.onclick = createNewChat;

    if (chats.length === 0) createNewChat();
    else { currentChatId = chats[0].id; renderSidebar(); renderMessages(); }
  </script>
</body>
  </html>
