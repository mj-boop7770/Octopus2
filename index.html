<script>
  // 1. Configuration de Marked avec bouton de copie de code intégré
  const renderer = new marked.Renderer();
  renderer.code = function(code, language) {
    const validLang = language && hljs.getLanguage(language) ? language : 'plaintext';
    const highlighted = hljs.highlight(code, { language: validLang }).value;
    const codeId = 'code-' + Math.random().toString(36).substr(2, 9);
    
    return `
      <div class="relative group my-3 rounded-xl overflow-hidden border border-slate-800 bg-slate-900">
        <div class="flex items-center justify-between px-4 py-1.5 bg-slate-800/80 text-[11px] text-slate-400 font-mono">
          <span>${validLang}</span>
          <button onclick="copyCode('${codeId}', this)" class="hover:text-white transition flex items-center gap-1">
            <i class="fa-regular fa-copy"></i> Copier
          </button>
        </div>
        <pre class="p-4 overflow-x-auto text-xs font-mono"><code id="${codeId}">${highlighted}</code></pre>
      </div>`;
  };

  marked.setOptions({ renderer: renderer, breaks: true });

  // Fonction de copie du code
  window.copyCode = function(id, btn) {
    const codeText = document.getElementById(id).innerText;
    navigator.clipboard.writeText(codeText).then(() => {
      btn.innerHTML = `<i class="fa-solid fa-check text-emerald-400"></i> Copié !`;
      setTimeout(() => {
        btn.innerHTML = `<i class="fa-regular fa-copy"></i> Copier`;
      }, 2000);
    });
  };

  // Variables globales
  let chats = JSON.parse(localStorage.getItem('octopus_chats')) || [];
  let currentChatId = null;
  let isWebSearchActive = false;
  let currentAbortController = null; // Pour pouvoir stopper la génération

  // Éléments DOM
  const sidebar = document.getElementById('sidebar');
  const sidebarOverlay = document.getElementById('sidebar-overlay');
  const openSidebarBtn = document.getElementById('open-sidebar-btn');
  const closeSidebarBtn = document.getElementById('close-sidebar-btn');
  const chatListEl = document.getElementById('chat-list');
  const messagesContainer = document.getElementById('messages-container');
  const chatForm = document.getElementById('chat-form');
  const userInput = document.getElementById('user-input');
  const modeSelect = document.getElementById('mode-select');
  const webToggle = document.getElementById('web-search-toggle');
  const webStatus = document.getElementById('web-status');
  const newChatBtn = document.getElementById('new-chat-btn');
  const currentChatTitle = document.getElementById('current-chat-title');
  const micBtn = document.getElementById('mic-btn');
  const sendBtn = document.getElementById('send-btn');

  // Textarea Auto-resize
  userInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
  });

  // Reconnaissance Vocale (Micro)
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';

    micBtn.onclick = () => {
      recognition.start();
      micBtn.classList.add('text-indigo-400', 'animate-pulse');
    };

    recognition.onresult = (e) => {
      userInput.value += e.results[0][0].transcript;
      userInput.style.height = (userInput.scrollHeight) + 'px';
    };

    recognition.onerror = recognition.onend = () => {
      micBtn.classList.remove('text-indigo-400', 'animate-pulse');
    };
  } else {
    micBtn.style.display = 'none';
  }

  // Lecture Vocale (Synthèse Vocale)
  window.speakText = function(text, btn) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel(); // Stoppe la lecture précédente s'il y en a une
      
      if (btn.classList.contains('speaking')) {
        btn.classList.remove('speaking', 'text-indigo-400');
        return;
      }

      // Nettoie le texte des balises Markdown pour la lecture
      const cleanText = text.replace(/[*#`_~]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'fr-FR';

      btn.classList.add('speaking', 'text-indigo-400');

      utterance.onend = () => btn.classList.remove('speaking', 'text-indigo-400');
      window.speechSynthesis.speak(utterance);
    }
  };

  function openSidebar() {
    sidebar.classList.remove('-translate-x-full');
    sidebarOverlay.classList.remove('hidden');
  }

  function closeSidebar() {
    sidebar.classList.add('-translate-x-full');
    sidebarOverlay.classList.add('hidden');
  }

  openSidebarBtn.onclick = () => sidebar.classList.contains('-translate-x-full') ? openSidebar() : closeSidebar();
  closeSidebarBtn.onclick = closeSidebar;
  sidebarOverlay.onclick = closeSidebar;

  webToggle.onclick = () => {
    isWebSearchActive = !isWebSearchActive;
    webStatus.textContent = isWebSearchActive ? 'ON' : 'OFF';
    webStatus.className = isWebSearchActive ? 'text-emerald-400 font-bold' : 'text-red-400';
  };

  function saveChats() { localStorage.setItem('octopus_chats', JSON.stringify(chats)); }

  function createNewChat() {
    const newChat = { id: Date.now().toString(), title: 'Nouvelle discussion', messages: [] };
    chats.unshift(newChat);
    currentChatId = newChat.id;
    saveChats();
    renderSidebar();
    renderMessages();
    if (window.innerWidth < 768) closeSidebar();
  }

  function renderSidebar() {
    chatListEl.innerHTML = '';
    chats.forEach(chat => {
      const btn = document.createElement('div');
      const isActive = chat.id === currentChatId;
      btn.className = `p-2 rounded-xl text-xs font-medium cursor-pointer flex items-center justify-between group transition ${isActive ? 'bg-indigo-600/10 text-indigo-400' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'}`;
      btn.innerHTML = `
        <div class="flex items-center gap-2 truncate">
          <i class="fa-regular fa-message text-slate-500"></i>
          <span class="truncate">${chat.title}</span>
        </div>
        <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 p-1 transition">
          <i class="fa-solid fa-trash"></i>
        </button>`;
      btn.onclick = (e) => {
        if (!e.target.closest('button')) {
          currentChatId = chat.id;
          renderSidebar();
          renderMessages();
          if (window.innerWidth < 768) closeSidebar();
        }
      };
      chatListEl.appendChild(btn);
    });
  }

  function deleteChat(e, id) {
    e.stopPropagation();
    chats = chats.filter(c => c.id !== id);
    currentChatId = chats.length > 0 ? chats[0].id : null;
    saveChats();
    if (!currentChatId) createNewChat();
    else { renderSidebar(); renderMessages(); }
  }

  function renderMessages() {
    const current = chats.find(c => c.id === currentChatId);
    if (!current) return;
    if (currentChatTitle) currentChatTitle.textContent = current.title;

    if (current.messages.length === 0) {
      messagesContainer.innerHTML = `
        <div class="h-full flex flex-col items-center justify-center text-center text-slate-500 my-auto py-12">
          <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-2xl mb-4 text-indigo-400">🐙</div>
          <h2 class="text-xl font-semibold text-slate-200 mb-2">Bonjour ! Comment puis-je vous aider ?</h2>
          <p class="text-xs max-w-sm text-slate-400 leading-relaxed">Posez vos questions, générez du code ou créez des visuels en toute simplicité.</p>
        </div>`;
      return;
    }

    messagesContainer.innerHTML = '';
    current.messages.forEach((m, idx) => {
      const isUser = m.role === 'user';
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex gap-3 sm:gap-4 ${isUser ? 'justify-end' : 'justify-start'}`;
      
      let contentHtml = isUser 
        ? `<div class="bg-indigo-600 text-white p-3.5 rounded-2xl text-xs sm:text-sm max-w-[85%] whitespace-pre-wrap">${escapeHtml(m.content)}</div>`
        : `<div class="flex-1 bg-transparent text-slate-200 text-xs sm:text-sm markdown-body overflow-hidden">
            ${marked.parse(m.content)}
            <div class="flex items-center gap-2 mt-2 pt-2 border-t border-slate-800/40 text-slate-500 text-xs">
              <button onclick="speakText(\`${escapeHtml(m.content)}\`, this)" class="hover:text-slate-300 transition flex items-center gap-1 text-[11px]">
                <i class="fa-solid fa-volume-high"></i> Écouter
              </button>
            </div>
           </div>`;

      msgDiv.innerHTML = `
        ${!isUser ? `<div class="w-7 h-7 rounded-lg bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-xs shrink-0 font-bold">🐙</div>` : ''}
        ${contentHtml}
      `;
      messagesContainer.appendChild(msgDiv);
    });

    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function escapeHtml(text) { 
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); 
  }

  // Soumission du Formulaire
  chatForm.onsubmit = async (e) => {
    e.preventDefault();

    // Si une génération est en cours, le bouton sert d'arrêt (Stop)
    if (currentAbortController) {
      currentAbortController.abort();
      currentAbortController = null;
      resetSendButton();
      return;
    }

    const content = userInput.value.trim();
    if (!content) return;

    if (!currentChatId) createNewChat();
    const current = chats.find(c => c.id === currentChatId);

    if (current.messages.length === 0) {
      current.title = content.slice(0, 25) + (content.length > 25 ? '...' : '');
    }

    current.messages.push({ role: 'user', content });
    userInput.value = '';
    userInput.style.height = 'auto';
    saveChats();
    renderSidebar();
    renderMessages();

    // Basculer le bouton en mode "Arrêter" (Stop)
    setStopButton();

    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'flex gap-3 justify-start';
    loadingDiv.innerHTML = `
      <div class="w-7 h-7 rounded-lg bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-xs shrink-0 font-bold">🐙</div>
      <div class="text-xs text-slate-400 flex items-center gap-2 pt-1.5">
        <i class="fa-solid fa-spinner fa-spin text-indigo-400"></i> Réflexion en cours...
      </div>`;
    messagesContainer.appendChild(loadingDiv);
    messagesContainer.scrollTop = messagesContainer.scrollHeight;

    currentAbortController = new AbortController();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: currentAbortController.signal,
        body: JSON.stringify({ messages: current.messages, mode: modeSelect.value, webSearch: isWebSearchActive })
      });

      const data = await res.json();
      loadingDiv.remove();

      if (res.ok && data.reply) {
        current.messages.push({ role: 'bot', content: data.reply });
      } else {
        current.messages.push({ role: 'bot', content: `⚠️ Erreur : ${data.error || 'Impossible de répondre'}` });
      }
    } catch (err) {
      loadingDiv.remove();
      if (err.name === 'AbortError') {
        current.messages.push({ role: 'bot', content: '🛑 *Génération interrompue.*' });
      } else {
        current.messages.push({ role: 'bot', content: '⚠️ Connexion interrompue.' });
      }
    }

    currentAbortController = null;
    resetSendButton();
    saveChats();
    renderMessages();
  };

  function setStopButton() {
    sendBtn.innerHTML = `<i class="fa-solid fa-square text-xs"></i> Stop`;
    sendBtn.className = 'bg-red-600 hover:bg-red-500 text-white rounded-xl px-3 py-1.5 transition text-xs font-medium flex items-center gap-1.5 shadow-md';
  }

  function resetSendButton() {
    sendBtn.innerHTML = `<span>Envoyer</span><i class="fa-solid fa-paper-plane text-[10px]"></i>`;
    sendBtn.className = 'bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl px-3 py-1.5 transition text-xs font-medium flex items-center gap-1.5 shadow-md';
  }

  newChatBtn.onclick = createNewChat;

  if (chats.length === 0) createNewChat();
  else { currentChatId = chats[0].id; renderSidebar(); renderMessages(); }
      </script>
