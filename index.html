<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octopus AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col md:flex-row overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-full md:w-80 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex flex-col justify-between shrink-0 h-auto md:h-full">
    <div class="p-4 flex flex-col h-full overflow-hidden">
      <!-- Header / Logo -->
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
            🐙
          </div>
          <span class="font-bold text-lg tracking-wide text-white">Octopus AI</span>
        </div>
        <button id="new-chat-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2 rounded-xl font-medium transition flex items-center gap-1 shadow-md">
          <i class="fa-solid fa-plus"></i> Nouveau
        </button>
      </div>

      <!-- Liste des discussions -->
      <div class="flex-1 overflow-y-auto custom-scrollbar space-y-1 my-2" id="chat-list">
        <!-- Généré dynamiquement -->
      </div>

      <!-- Footer Sidebar -->
      <div class="pt-3 border-t border-slate-800 text-xs text-slate-500 flex justify-between items-center">
        <span>Octopus Engine v2.0</span>
        <span class="text-indigo-400 font-semibold">Web Enabled 🌐</span>
      </div>
    </div>
  </aside>

  <!-- Zone Principale -->
  <main class="flex-1 flex flex-col h-full bg-slate-950 relative overflow-hidden">
    
    <!-- Header Chat -->
    <header class="h-16 border-b border-slate-800 bg-slate-900/50 backdrop-blur-md px-6 flex items-center justify-between z-10">
      <div class="flex items-center gap-3">
        <h1 class="font-semibold text-slate-200" id="current-chat-title">Nouvelle Discussion</h1>
      </div>

      <div class="flex items-center gap-3">
        <!-- Bouton recherche Web -->
        <button id="web-search-toggle" class="bg-slate-900 border border-slate-800 text-slate-400 text-xs px-3 py-1.5 rounded-xl font-semibold flex items-center gap-1.5 transition hover:border-slate-700">
          <span>🌐 Web:</span>
          <span id="web-status" class="text-red-400 font-bold">OFF</span>
        </button>

        <!-- Selecteur de Mode -->
        <select id="mode-select" class="bg-slate-900 border border-slate-800 text-slate-300 text-xs rounded-xl px-3 py-1.5 focus:outline-none focus:border-indigo-500 font-medium">
          <option value="general">🤖 General</option>
          <option value="code">💻 Code</option>
          <option value="writing">📝 Rédaction</option>
        </select>
      </div>
    </header>

    <!-- Zone des Messages -->
    <div id="messages-container" class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-6 space-y-6">
      <div class="h-full flex flex-col items-center justify-center text-center text-slate-500 my-auto">
        <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-3xl mb-4 shadow-inner">
          🐙
        </div>
        <h2 class="text-lg font-medium text-slate-300 mb-1">Comment puis-je t'aider aujourd'hui ?</h2>
        <p class="text-xs max-w-sm text-slate-500">Pose-moi une question, demande du code, ou active la recherche Web 🌐 pour des infos en direct.</p>
      </div>
    </div>

    <!-- Zone de Saisie -->
    <div class="p-4 bg-slate-950 border-t border-slate-800/60">
      <form id="chat-form" class="max-w-4xl mx-auto relative flex items-center">
        <textarea id="user-input" rows="1" placeholder="Écris ton message à Octopus AI..." class="w-full bg-slate-900 text-slate-100 placeholder-slate-500 text-sm rounded-2xl pl-4 pr-12 py-3.5 border border-slate-800 focus:outline-none focus:border-indigo-500 resize-none max-h-32 shadow-lg transition"></textarea>
        <button type="submit" id="send-btn" class="absolute right-2.5 p-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition shadow-md flex items-center justify-center w-8 h-8">
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </form>
    </div>
  </main>

  <script>
    // --- ÉTATS GLOBAUX ---
    let chats = JSON.parse(localStorage.getItem('octopus_chats')) || [];
    let currentChatId = null;
    let isWebSearchActive = false;

    // Element DOM
    const chatListEl = document.getElementById('chat-list');
    const messagesContainer = document.getElementById('messages-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const modeSelect = document.getElementById('mode-select');
    const webToggle = document.getElementById('web-search-toggle');
    webToggle.onclick = () => {
      isWebSearchActive = !isWebSearchActive;
      webStatus.textContent = isWebSearchActive ? 'ON' : 'OFF';
      webStatus.className = isWebSearchActive ? 'text-green-400 font-bold' : 'text-red-400';
      webToggle.classList.toggle('border-indigo-500', isWebSearchActive);
      webToggle.classList.toggle('bg-slate-800', isWebSearchActive);
    };
    const webStatus = document.getElementById('web-status');
    const newChatBtn = document.getElementById('new-chat-btn');
    const currentChatTitle = document.getElementById('current-chat-title');

    // --- GESTION RECHERCHE WEB TOGGLE ---
    webToggle.onclick = () => {
      isWebSearchActive = !isWebSearchActive;
      webStatus.textContent = isWebSearchActive ? 'ON' : 'OFF';
      webStatus.className = isWebSearchActive ? 'text-green-400 font-bold' : 'text-red-400';
      webToggle.classList.toggle('border-indigo-500', isWebSearchActive);
    };

    // --- GESTION DES CHATS ---
    function saveChats() {
      localStorage.setItem('octopus_chats', JSON.stringify(chats));
    }

    function createNewChat() {
      const newChat = {
        id: Date.now().toString(),
        title: 'Nouvelle Discussion',
        messages: []
      };
      chats.unshift(newChat);
      currentChatId = newChat.id;
      saveChats();
      renderSidebar();
      renderMessages();
    }

    function renderSidebar() {
      chatListEl.innerHTML = '';
      chats.forEach(chat => {
        const btn = document.createElement('div');
        const isActive = chat.id === currentChatId;
        btn.className = `p-2.5 rounded-xl text-xs font-medium cursor-pointer flex items-center justify-between group transition ${isActive ? 'bg-indigo-600/10 text-indigo-400 border border-indigo-500/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'}`;
        
        btn.innerHTML = `
          <div class="flex items-center gap-2 truncate">
            <i class="fa-regular fa-message text-slate-500"></i>
            <span class="truncate">${chat.title}</span>
          </div>
          <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 transition p-1">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        btn.onclick = (e) => {
          if (!e.target.closest('button')) {
            currentChatId = chat.id;
            renderSidebar();
            renderMessages();
          }
        };
        chatListEl.appendChild(btn);
      });
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      if (currentChatId === id) {
        currentChatId = chats.length > 0 ? chats[0].id : null;
      }
      saveChats();
      if (!currentChatId) createNewChat();
      else {
        renderSidebar();
        renderMessages();
      }
    }

    function renderMessages() {
      const current = chats.find(c => c.id === currentChatId);
      if (!current) return;

      currentChatTitle.textContent = current.title;

      if (current.messages.length === 0) {
        messagesContainer.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center text-slate-500 my-auto">
            <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center text-3xl mb-4 shadow-inner">🐙</div>
            <h2 class="text-lg font-medium text-slate-300 mb-1">Comment puis-je t'aider aujourd'hui ?</h2>
            <p class="text-xs max-w-sm text-slate-500">Pose-moi une question, demande du code, ou active la recherche Web 🌐 pour des infos en direct.</p>
          </div>
        `;
        return;
      }

      messagesContainer.innerHTML = '';
      current.messages.forEach(m => {
        const isUser = m.role === 'user';
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex gap-3 max-w-3xl ${isUser ? 'ml-auto flex-row-reverse' : 'mr-auto'}`;
        
        msgDiv.innerHTML = `
          <div class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 text-xs font-bold ${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-indigo-400 border border-slate-700'}">
            ${isUser ? 'Vous' : '🐙'}
          </div>
          <div class="p-3.5 rounded-2xl text-sm leading-relaxed ${isUser ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-slate-900 text-slate-200 border border-slate-800 rounded-tl-none'} shadow-sm whitespace-pre-wrap">${escapeHtml(m.content)}</div>
        `;
        messagesContainer.appendChild(msgDiv);
      });

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // --- SOUMISSION DE MESSAGE ---
    chatForm.onsubmit = async (e) => {
      e.preventDefault();
      const content = userInput.value.trim();
      if (!content) return;

      if (!currentChatId) createNewChat();
      const current = chats.find(c => c.id === currentChatId);

      // Met à jour le titre au 1er message
      if (current.messages.length === 0) {
        current.title = content.slice(0, 25) + (content.length > 25 ? '...' : '');
      }

      // Ajout message utilisateur
      current.messages.push({ role: 'user', content });
      userInput.value = '';
      saveChats();
      renderSidebar();
      renderMessages();

      // Indicateur de chargement
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'flex gap-3 max-w-3xl mr-auto';
      loadingDiv.innerHTML = `
        <div class="w-8 h-8 rounded-xl bg-slate-800 text-indigo-400 border border-slate-700 flex items-center justify-center shrink-0 text-xs font-bold">🐙</div>
        <div class="p-3.5 rounded-2xl bg-slate-900 text-slate-400 text-xs border border-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-spinner fa-spin"></i> ${isWebSearchActive ? 'Recherche sur le web...' : 'Réflexion en cours...'}
        </div>
      `;
      messagesContainer.appendChild(loadingDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: current.messages,
            mode: modeSelect.value,
            webSearch: isWebSearchActive
          })
        });

        const data = await res.json();
        loadingDiv.remove();

        if (res.ok && data.reply) {
          current.messages.push({ role: 'bot', content: data.reply });
        } else {
          current.messages.push({ role: 'bot', content: `⚠️ Erreur : ${data.error || 'Impossible d\'obtenir une réponse'}` });
        }
      } catch (err) {
        loadingDiv.remove();
        current.messages.push({ role: 'bot', content: '⚠️ Erreur de connexion au serveur.' });
      }

      saveChats();
      renderMessages();
    };

    newChatBtn.onclick = createNewChat;

    // Initialisation
    if (chats.length === 0) createNewChat();
    else {
      currentChatId = chats[0].id;
      renderSidebar();
      renderMessages();
    }
  </script>
</body>
</html>
