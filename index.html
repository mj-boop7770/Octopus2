<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Octopus AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans h-[100dvh] w-screen flex flex-col overflow-hidden">

  <!-- HEADER -->
  <header class="bg-[#090d16] border-b border-slate-800 p-4 flex-none flex items-center justify-between shadow-md">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🐙</span>
      <h1 class="font-bold text-lg text-slate-100">Octopus <span class="text-indigo-400">AI</span></h1>
    </div>
  </header>

  <!-- ZONE DE CHAT -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
    <div class="p-4 bg-slate-900 border border-slate-800 rounded-2xl text-slate-300 text-sm">
      👋 <b>Bienvenue sur Octopus AI !</b><br>Pose ta question ci-dessous pour démarrer.
    </div>
  </main>

  <!-- FORMULAIRE DE SAISIE FIXE EN BAS -->
  <footer class="bg-[#090d16] border-t border-slate-800 p-3 flex-none z-10">
    <form id="chat-form" class="max-w-4xl mx-auto flex items-center gap-2 bg-[#030712] border border-indigo-900/50 rounded-2xl p-2">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Pose une question..." 
        autocomplete="off"
        class="flex-1 bg-transparent text-slate-100 placeholder-slate-500 text-sm focus:outline-none px-2"
      />
      <button 
        type="submit" 
        class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl transition shrink-0 font-bold"
      >
        ➔
      </button>
    </form>
  </footer>

  <script>
    const chatBox = document.getElementById('chat-box');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = sender === 'user' ? 'flex justify-end' : 'flex justify-start';

      const inner = document.createElement('div');
      inner.className = sender === 'user' 
        ? 'bg-indigo-600 text-white rounded-2xl px-4 py-3 text-sm max-w-[85%]' 
        : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-2xl px-4 py-3 text-sm max-w-[85%]';

      if (sender === 'bot') {
        inner.innerHTML = typeof marked !== 'undefined' ? marked.parse(text) : text;
      } else {
        inner.textContent = text;
      }

      msgDiv.appendChild(inner);
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return inner;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';

      const botMsg = appendMessage('bot', '🐙 *Réflexion en cours...*');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        if (res.ok && data.reply) {
          botMsg.innerHTML = typeof marked !== 'undefined' ? marked.parse(data.reply) : data.reply;
        } else {
          botMsg.innerHTML = `⚠️ **Erreur :** ${data.error || 'Problème de réponse API'}`;
        }
      } catch (err) {
        botMsg.innerHTML = `⚠️ **Erreur réseau**`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
  </html>
