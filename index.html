<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octopus AI - Édition Ultime</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Prism.js Coloration syntaxique -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
  
  <style>
    @keyframes pulse-tentacles {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.15) rotate(5deg); opacity: 0.8; }
    }
    .octopus-thinking {
      animation: pulse-tentacles 1.2s infinite ease-in-out;
      display: inline-block;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col md:flex-row font-sans overflow-hidden">

  <!-- OVERLAY MOBILE -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-20 hidden md:hidden"></div>

  <!-- BARRE LATÉRALE (Historique, Recherche, Modes) -->
  <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-white border-r border-gray-200 p-4 z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200 flex flex-col justify-between shadow-lg md:shadow-none">
    <div class="flex flex-col h-full">
      
      <!-- Bouton Nouvelle discussion & Fermeture mobile -->
      <div class="flex items-center justify-between mb-4 gap-2">
        <button id="new-chat-btn" class="flex-1 bg-gray-900 hover:bg-gray-800 text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition text-sm shadow-sm">
          <span>➕</span> Nouvelle discussion
        </button>
        <button id="close-sidebar-btn" class="md:hidden p-2 text-gray-500 hover:text-gray-800 text-xl font-bold">✕</button>
      </div>

      <!-- Barre de recherche dans l'historique -->
      <div class="mb-3">
        <input type="text" id="search-history" placeholder="🔍 Rechercher..." class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <!-- Liste des discussions récentes -->
      <div class="flex-1 overflow-y-auto space-y-1 pr-1" id="history-list">
        <!-- Historique injecté dynamiquement -->
      </div>
    </div>

    <!-- Mode de travail & Profil -->
    <div class="border-t border-gray-100 pt-3 space-y-3">
      <div>
        <label class="text-xs font-medium text-gray-500 block mb-1">Mode de travail :</label>
        <select id="mode-select" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="code">💻 Mode Développeur</option>
          <option value="writing">✍️ Mode Rédaction</option>
          <option value="general">🧠 Mode Général</option>
        </select>
      </div>
      <div class="text-xs text-gray-400 flex items-center justify-between pt-2 border-t border-gray-100">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold">L</div>
          <span>Octopus v2.0</span>
        </div>
        <button id="export-chat-btn" class="text-indigo-600 hover:text-indigo-800 font-medium text-xs underline" title="Exporter la conversation">📥 Exporter</button>
      </div>
    </div>
  </aside>

  <!-- ZONE PRINCIPALE CHAT -->
  <main class="flex-1 flex flex-col h-full bg-white relative">
    
    <!-- EN-TÊTE -->
    <header class="p-3 border-b border-gray-100 flex justify-between items-center bg-white sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <button id="open-sidebar-btn" class="md:hidden p-2 text-gray-600 hover:bg-gray-100 rounded-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
        <h1 class="text-base font-semibold text-gray-800 flex items-center gap-2">
          <span id="octopus-logo" class="text-xl">🐙</span> Octopus AI
        </h1>
      </div>
      <span class="text-xs bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full font-medium border border-gray-200">Groq Powered</span>
    </header>

    <!-- Zone de discussion -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-3xl w-full mx-auto">
      <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 text-gray-700 text-sm">
        👋 **Salut Léandre !** Tout est en place. Colle ton code, utilise les raccourcis ou pose ta question.
      </div>
    </div>

    <!-- ZONE DE SAISIE & SHORTCUTS RAPIDES -->
    <footer class="p-3 border-t border-gray-100 bg-white">
      <div class="max-w-3xl mx-auto flex flex-col gap-2">
        
        <!-- Boutons de raccourcis rapides (Prompts instantanés) -->
        <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
          <button type="button" class="shortcut-btn bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 text-gray-600 px-3 py-1 rounded-full whitespace-nowrap transition border border-gray-200" data-prompt="🐛 Analyse ce code et trouve les bugs potentiels :">🐛 Débugger</button>
          <button type="button" class="shortcut-btn bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 text-gray-600 px-3 py-1 rounded-full whitespace-nowrap transition border border-gray-200" data-prompt="🚀 Optimise ce code pour le rendre plus propre et rapide :">🚀 Optimiser</button>
          <button type="button" class="shortcut-btn bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 text-gray-600 px-3 py-1 rounded-full whitespace-nowrap transition border border-gray-200" data-prompt="📝 Explique-moi ce code ligne par ligne en détail :">📝 Expliquer</button>
          <button type="button" class="shortcut-btn bg-gray-100 hover:bg-indigo-50 hover:text-indigo-600 text-gray-600 px-3 py-1 rounded-full whitespace-nowrap transition border border-gray-200" data-prompt="✍️ Corrige, fluidifie et améliore le style de ce texte :">✍️ Corriger style</button>
        </div>

        <!-- Prévisualisation Fichier -->
        <div id="file-preview" class="hidden text-xs bg-indigo-50 text-indigo-700 p-2 rounded-lg flex justify-between items-center border border-indigo-100">
          <span id="file-name" class="font-medium truncate">fichier.txt</span>
          <button type="button" id="remove-file" class="text-red-500 hover:text-red-700 font-bold ml-2">✕</button>
        </div>

        <!-- Formulaire de saisie -->
        <form id="chat-form" class="flex gap-2 items-center bg-gray-50 rounded-2xl p-2 border border-gray-200 focus-within:border-indigo-500 focus-within:bg-white transition shadow-sm">
          
          <label for="file-input" class="cursor-pointer p-2 text-gray-400 hover:text-indigo-600 transition" title="Joindre un fichier">
            📎
            <input type="file" id="file-input" class="hidden" accept=".js,.py,.html,.css,.json,.txt,.md,image/*">
          </label>

          <textarea id="user-input" rows="1" placeholder="Écris ton message..." class="flex-1 bg-transparent text-gray-800 text-sm focus:outline-none resize-none px-2 max-h-32"></textarea>

          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2 rounded-xl transition font-bold shadow-sm">
            ➔
          </button>
        </form>
      </div>
    </footer>

  </main>

  <!-- Scripts Prism.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

  <script src="app.js"></script>
</body>
            </html>
