<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Octopus AI</title>
  
  <!-- Style Tailwind CSS pour un design épuré type Claude -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Coloration Syntaxique (Prism.js) style sombre -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex">

  <!-- BARRE LATÉRALE (Historique & Modes) -->
  <aside class="w-64 bg-gray-950 p-4 hidden md:flex flex-col justify-between border-r border-gray-800">
    <div>
      <button id="new-chat-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg mb-6 flex items-center justify-center gap-2 transition">
        ➕ Nouvelle conversation
      </button>

      <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Historique</h2>
      <div id="history-list" class="space-y-2 overflow-y-auto max-h-[60vh]">
        <!-- Les conversations sauvegardées s'afficheront ici -->
      </div>
    </div>

    <!-- Choix du Mode -->
    <div class="border-t border-gray-800 pt-4">
      <label class="text-xs text-gray-400 block mb-2">Mode de travail :</label>
      <select id="mode-select" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-sm text-gray-200">
        <option value="code">💻 Mode Développeur / Code</option>
        <option value="writing">✍️ Mode Rédaction & Style</option>
        <option value="general">🧠 Mode Général</option>
      </select>
    </div>
  </aside>

  <!-- ZONE PRINCIPALE CHAT -->
  <main class="flex-1 flex flex-col h-full">
    
    <!-- En-tête -->
    <header class="p-4 border-b border-gray-800 flex justify-between items-center bg-gray-900">
      <h1 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
        🐙 Octopus AI
      </h1>
      <span class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2 py-1 rounded-full">Groq Powered</span>
    </header>

    <!-- Zone de messages -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
      <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700 text-gray-300">
        👋 **Salut Léandre !** Je suis Octopus. Colle ton code, téléverse un fichier texte ou pose-moi tes questions, je suis prêt !
      </div>
    </div>

    <!-- Zone de saisie d'input -->
    <footer class="p-4 border-t border-gray-800 bg-gray-900">
      <form id="chat-form" class="max-w-4xl mx-auto flex flex-col gap-2">
        
        <!-- Zone de prévisualisation du fichier attaché -->
        <div id="file-preview" class="hidden text-xs bg-indigo-950 text-indigo-300 p-2 rounded flex justify-between items-center">
          <span id="file-name">fichier.txt</span>
          <button type="button" id="remove-file" class="text-red-400 hover:text-red-300 font-bold">✕</button>
        </div>

        <div class="flex gap-2 items-center bg-gray-800 rounded-xl p-2 border border-gray-700 focus-within:border-indigo-500">
          
          <!-- Bouton Joindre Fichier/Photo -->
          <label for="file-input" class="cursor-pointer p-2 text-gray-400 hover:text-indigo-400 transition" title="Joindre un fichier ou une image">
            📎
            <input type="file" id="file-input" class="hidden" accept=".js,.py,.html,.css,.json,.txt,.md,image/*">
          </label>

          <!-- Champ texte -->
          <textarea id="user-input" rows="1" placeholder="Pose une question ou colle du code..." class="flex-1 bg-transparent text-gray-100 focus:outline-none resize-none px-2 max-h-32"></textarea>

          <!-- Bouton Envoyer -->
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-lg transition font-bold">
            ➔
          </button>
        </div>
      </form>
    </footer>

  </main>

  <!-- Scripts pour la coloration de code -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>

  <!-- Ton fichier JS d'interaction -->
  <script src="app.js"></script>
</body>
</html>
