<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Octopus AI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js pour le Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Prism.js pour la coloration syntaxique du code -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

  <style>
    /* Barre de défilement personnalisée aux couleurs ciel */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #0284c7;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

  <!-- OVERLAY FLOU DERRIÈRE LA SIDEBAR SUR MOBILE -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-sky-950/40 z-40 hidden backdrop-blur-sm transition-opacity"></div>

  <!-- MENU LATÉRAL / SIDEBAR (HISTORIQUE DES DISCUSSIONS) -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-slate-900 border-r border-sky-900/40 p-4 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col justify-between shadow-2xl">
    <div>
      <!-- En-tête Sidebar -->
      <div class="flex justify-between items-center mb-6 border-b border-sky-900/30 pb-3">
        <h2 class="text-lg font-bold text-sky-400 flex items-center gap-2">
          <span>🐙</span> Octopus AI
        </h2>
        <button id="close-sidebar-btn" class="text-sky-300/60 hover:text-sky-200 text-xl p-1 transition">✕</button>
      </div>

      <!-- Bouton Nouvelle Discussion -->
      <button id="new-chat-btn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 mb-6 shadow-lg shadow-sky-500/20 transition active:scale-[0.98]">
        <span class="text-lg">+</span> Nouvelle discussion
      </button>

      <!-- Liste des discussions archivées -->
      <div class="space-y-2">
        <p class="text-xs font-semibold text-sky-400/70 uppercase tracking-wider px-1">Historique</p>
        <div id="history-list" class="space-y-1 max-h-[60vh] overflow-y-auto pr-1">
          <!-- Les sessions s'afficheront ici dynamiquement -->
        </div>
      </div>
    </div>

    <!-- Pied de Sidebar -->
    <div class="text-xs text-sky-300/40 text-center border-t border-sky-900/30 pt-3">
      Octopus AI • Bleu Ciel v2.0
    </div>
  </aside>

  <!-- ENTÊTE PRINCIPALE DE L'APPLICATION -->
  <header class="bg-slate-900 border-b border-sky-900/40 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-3">
      <button id="open-sidebar-btn" class="p-2 rounded-xl bg-slate-800 text-sky-400 hover:bg-slate-700 hover:text-sky-300 transition focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <div class="flex items-center gap-2">
        <span class="text-2xl">🐙</span>
        <h1 class="font-bold text-lg text-slate-100 tracking-wide">Octopus <span class="text-sky-400">AI</span></h1>
      </div>
    </div>

    <!-- SÉLECTEUR DE MODE -->
    <div class="flex items-center gap-2">
      <select id="mode-select" class="bg-slate-800 border border-sky-500/30 text-sky-200 text-xs font-medium rounded-xl px-3 py-1.5 focus:outline-none focus:border-sky-400 transition">
        <option value="general">🌐 Général</option>
        <option value="code">💻 Code & Dev</option>
        <option value="writing">✍️ Rédaction</option>
      </select>
    </div>
  </header>

  <!-- CONTENEUR PRINCIPAL DE LA DISCUSSION -->
  <main class="flex-1 overflow-y-auto p-4 md:p-6" id="chat-box">
    <!-- Les messages seront générés ici par app.js -->
  </main>

  <!-- APERÇU DU FICHIER JOINT -->
  <div id="file-preview" class="hidden px-4 py-2 bg-slate-900 border-t border-sky-900/30 flex items-center justify-between text-xs text-sky-300">
    <span id="file-name" class="truncate max-w-[80%] font-mono">📎 Fichier prêt</span>
    <button id="remove-file" class="text-sky-400 hover:text-red-400 font-bold px-2 py-0.5 transition">✕ Supprimer</button>
  </div>

  <!-- BARRE DE SAISIE ET ENVOI -->
  <footer class="bg-slate-900 border-t border-sky-900/40 p-3 md:p-4">
    <form id="chat-form" class="max-w-4xl mx-auto flex items-end gap-2 bg-slate-950 border border-sky-900/50 rounded-2xl p-2 focus-within:border-sky-400 focus-within:ring-1 focus-within:ring-sky-400 transition shadow-lg">
      
      <!-- BOUTON FICHIER JOINT -->
      <label for="file-input" class="p-2 text-sky-400 hover:text-sky-200 hover:bg-slate-900 rounded-xl cursor-pointer transition flex items-center justify-center">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
        </svg>
        <input type="file" id="file-input" class="hidden" accept=".txt,.js,.html,.css,.json,.py,.md" />
      </label>

      <!-- CHAMP DE SAISIE TEXTE -->
      <textarea 
        id="user-input" 
        rows="1" 
        placeholder="Pose ta question à Octopus..." 
        class="flex-1 bg-transparent text-slate-100 placeholder-sky-300/40 text-sm focus:outline-none resize-none max-h-32 py-2 px-1 font-sans"
      ></textarea>

      <!-- BOUTON D'ENVOI -->
      <button 
        type="submit" 
        id="send-btn" 
        class="bg-sky-500 hover:bg-sky-400 text-slate-950 p-2.5 rounded-xl transition shadow-md shadow-sky-500/20 active:scale-95 flex items-center justify-center font-bold"
      >
        <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19V5m0 0l-7 7m7-7l7 7"></path>
        </svg>
      </button>
    </form>
  </footer>

  <!-- SCRIPT JS DE L'APPLICATION -->
  <script src="app.js"></script>
</body>
</html>
