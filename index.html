<!DOCTYPE html>
<html lang="fr" class="dark h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Octopus AI</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js pour le Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Prism.js pour la coloration syntaxique du code -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

  <style>
    /* Masquer la scrollbar tout en gardant le défilement pour les raccourcis */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Custom Scrollbar sombre pour le chat */
    #chat-box::-webkit-scrollbar { width: 4px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#030712] text-slate-100 font-sans h-[100dvh] w-screen flex flex-col overflow-hidden">

  <!-- OVERLAY FLOU DERRIÈRE LA SIDEBAR SUR MOBILE -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-40 hidden backdrop-blur-sm transition-opacity"></div>

  <!-- MENU LATÉRAL / SIDEBAR (HISTORIQUE) -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-[#090d16] border-r border-slate-800/80 p-4 z-50 transform -translate-x-full transition-transform duration-300 flex flex-col justify-between shadow-2xl">
    <div>
      <div class="flex justify-between items-center mb-6 border-b border-slate-800/80 pb-3">
        <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <span>🐙</span> Octopus AI
        </h2>
        <button id="close-sidebar-btn" class="text-slate-400 hover:text-white text-xl p-1 transition">✕</button>
      </div>

      <button id="new-chat-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 mb-6 shadow-lg shadow-indigo-600/20 transition active:scale-[0.98]">
        <span class="text-lg">+</span> Nouvelle discussion
      </button>

      <div class="space-y-2">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-1">Historique</p>
        <div id="history-list" class="space-y-1 max-h-[55vh] overflow-y-auto pr-1">
          <!-- Les conversations séparées s'afficheront ici via app.js -->
        </div>
      </div>
    </div>

    <div class="text-xs text-slate-500 text-center border-t border-slate-800/80 pt-3">
      Octopus AI v2.0
    </div>
  </aside>

  <!-- BARRE EN-TÊTE (HEADER) -->
  <header class="bg-[#090d16] border-b border-slate-800/80 px-4 py-3 flex-none flex items-center justify-between shadow-md z-10">
    <div class="flex items-center gap-3">
      <button id="open-sidebar-btn" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-indigo-400 hover:bg-slate-800 transition focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
      <div class="flex items-center gap-2">
        <span class="text-2xl">🐙</span>
        <h1 class="font-bold text-lg text-slate-100 tracking-wide">Octopus <span class="text-indigo-400">AI</span></h1>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <span class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-950/60 text-indigo-400 border border-indigo-800/50">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Groq Powered
      </span>
      <select id="mode-select" class="bg-slate-900 border border-slate-800 text-indigo-300 text-xs font-semibold rounded-xl px-3 py-1.5 focus:outline-none focus:border-indigo-500 transition">
        <option value="general">🌐 Général</option>
        <option value="code">💻 Code & Dev</option>
        <option value="writing">✍️ Rédaction</option>
      </select>
    </div>
  </header>

  <!-- ZONE DE CHAT DYNAMIQUE (Prend tout l'espace disponible) -->
  <main class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4" id="chat-box">
    <!-- Les messages seront générés ici par app.js -->
  </main>

  <!-- PREVIEW FICHIER JOINT -->
  <div id="file-preview" class="hidden px-4 py-2 bg-[#090d16] border-t border-slate-800/80 flex items-center justify-between text-xs text-indigo-300 flex-none">
    <span id="file-name" class="truncate max-w-[80%] font-mono">📎 Fichier prêt</span>
    <button id="remove-file" class="text-red-400 hover:text-red-300 font-bold px-2 py-0.5 transition">✕ Supprimer</button>
  </div>

  <!-- ZONE FIXE DE SAISIE (VERROUILLÉE EN BAS) -->
  <footer class="bg-[#090d16] border-t border-slate-800/80 p-3 md:p-4 space-y-3 flex-none z-10">
    
    <!-- RACCOURCIS RAPIDES SLIDABLES -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs">
      <button class="shortcut-btn shrink-0 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition" data-prompt="Trouve et corrige le bug dans ce code :">
        🐛 Débugger
      </button>
      <button class="shortcut-btn shrink-0 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition" data-prompt="Optimise ce code pour le rendre plus propre et plus rapide :">
        🚀 Optimiser
      </button>
      <button class="shortcut-btn shrink-0 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition" data-prompt="Explique-moi le fonctionnement de ce code en détail :">
        📝 Expliquer
      </button>
    </div>

    <!-- CHAMP DE SAISIE ET BOUTON D'ENVOI -->
    <form id="chat-form" class="max-w-4xl mx-auto flex items-end gap-2 bg-[#030712] border border-indigo-900/40 rounded-2xl p-2 focus-within:border-indigo-500 transition shadow-lg">
      
      <label for="file-input" class="p-2 text-slate-400 hover:text-indigo-400 hover:bg-slate-900 rounded-xl cursor-pointer transition flex items-center justify-center shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path>
        </svg>
        <input type="file" id="file-input" class="hidden" accept=".txt,.js,.html,.css,.json,.py,.md" />
      </label>

      <textarea 
        id="user-input" 
        rows="1" 
        placeholder="Pose une question ou colle du code..." 
        class="flex-1 bg-transparent text-slate-100 placeholder-slate-500 text-sm focus:outline-none resize-none max-h-32 py-2 px-1 font-sans"
      ></textarea>

      <button 
        type="submit" 
        id="send-btn" 
        class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl transition shadow-md shadow-indigo-600/30 active:scale-95 flex items-center justify-center font-bold shrink-0"
      >
        <svg class="w-5 h-5 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19V5m0 0l-7 7m7-7l7 7"></path>
        </svg>
      </button>
    </form>
  </footer>

  <script src="app.js"></script>
</body>
          </html>
